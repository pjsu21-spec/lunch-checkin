<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2F9E44" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>다름달음 점심체크</title>
<style>
/* ===================== 리셋 & 토큰 ===================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --tomato:#D9480F;
  --tomato-tint:#FFF1E8;
  --vine:#2F9E44;
  --vine-dark:#237436;
  --vine-tint:#E6F6EA;
  --slate:#495057;
  --slate-tint:#EEF0F2;
  --danger:#E03131;
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface-tint:#F1F3F5;
  --border:#E5E7EB;
  --text:#1F2328;
  --text-secondary:#6B7280;
  --text-tertiary:#9CA3AF;
  --warning-bg:#FFF4E0;
  --warning-text:#C77700;
  --shadow-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ===================== 레이아웃 ===================== */
body{background:var(--bg);}
@media (min-width:521px){
  body{background:#EDEEF0;}
  .shell{box-shadow:0 0 0 1px var(--border),0 8px 40px rgba(16,24,40,.08);}
}
.shell{min-height:100vh;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;}
.app-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);}
.header-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:-.01em;}
.header-title .icon{width:22px;height:22px;}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--tomato-tint);color:var(--tomato);
  font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.content{flex:1;padding:16px;padding-bottom:20px;width:100%;}
.bottom-nav{position:sticky;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  color:var(--text-tertiary);font-size:11px;font-weight:700;}
.nav-tab .icon{width:22px;height:22px;}
.nav-tab.active{color:var(--vine);}
.nav-tab .avatar-tab-badge{width:22px;height:22px;border-radius:50%;background:var(--tomato-tint);color:var(--tomato);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.nav-tab.active .avatar-tab-badge{background:var(--vine);color:#fff;}

/* ===================== 공용 컴포넌트 ===================== */
.icon{display:inline-flex;flex-shrink:0;}
.icon svg{width:100%;height:100%;display:block;}
.card{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;}
.section-title .icon{width:18px;height:18px;color:var(--text-secondary);}
.desc-text{font-size:13px;color:var(--text-secondary);line-height:1.55;margin-bottom:14px;}
.empty-hint{color:var(--text-tertiary);font-size:14px;text-align:center;padding:26px 10px;line-height:1.6;}
.muted-text{color:var(--text-secondary);font-size:13px;line-height:1.5;margin:2px 0 10px;}
.table-scroll{overflow-x:auto;margin-top:4px;-webkit-overflow-scrolling:touch;}
.settlement-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
.settlement-table th,.settlement-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);}
.settlement-table th:first-child,.settlement-table td:first-child{text-align:left;}
.settlement-table thead th{color:var(--text-secondary);font-weight:700;font-size:12px;border-bottom:1.5px solid var(--border);}
.settlement-table tfoot td{font-weight:800;border-top:1.5px solid var(--border);border-bottom:none;background:var(--surface-tint);}
.quick-result-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;font-weight:600;}
.quick-result-row:last-child{border-bottom:none;}
.hint-text{font-size:13px;color:var(--text-tertiary);margin-top:10px;text-align:center;}
.source-note{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.55;
  padding:10px 12px;background:var(--surface-tint);border-radius:10px;}

.btn{min-height:50px;border-radius:14px;font-size:16px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:transform .12s ease,opacity .12s ease;padding:0 16px;}
.btn:active{transform:scale(.97);}
.btn.full{width:100%;}
.btn.small{min-height:40px;font-size:13.5px;padding:0 12px;}
.btn-primary{background:var(--vine);color:#fff;}
.btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--text);}
.btn-row{display:flex;gap:10px;margin-bottom:12px;}
.btn-row .btn{flex:1;}
.danger-text{color:var(--danger) !important;}

.chip{padding:10px 15px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
  font-size:13.5px;font-weight:700;color:var(--text-secondary);white-space:nowrap;}
.chip.selected{background:var(--text);border-color:var(--text);color:#fff;}
.chip.sm{padding:7px 12px;font-size:12.5px;}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.chip-row{display:flex;gap:10px;margin-bottom:14px;}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}

.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);flex-shrink:0;}
.icon-btn .icon{width:18px;height:18px;}
.icon-btn:active{background:var(--surface-tint);}
.icon-btn.danger{color:var(--danger);}
.link-btn{color:var(--vine-dark);font-weight:700;font-size:13.5px;padding:6px 2px;}
.link-btn.small{font-size:12.5px;}

label{display:block;font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
input[type=text],input[type=time],input[type=date],input[type=number],textarea{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);
  font-size:16px;margin-bottom:12px;}
textarea{resize:vertical;min-height:84px;}
.date-jump-input{margin-top:8px;margin-bottom:0;font-size:13px;padding:8px 10px;color:var(--text-secondary);width:auto;}

.avatar-circle{width:38px;height:38px;border-radius:50%;background:var(--vine-tint);color:var(--vine-dark);
  font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.avatar-circle.sm{width:32px;height:32px;font-size:13px;}
.avatar-circle.lg{width:60px;height:60px;font-size:22px;margin:0 auto 10px;}

.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;}
.badge-eat{background:var(--vine-tint);color:var(--vine-dark);}
.badge-skip{background:var(--slate-tint);color:var(--slate);}
.badge-unchecked{background:var(--warning-bg);color:var(--warning-text);}
.badge-guest{background:#E7F1FF;color:#1C6DD0;}
.badge-daily{background:#F3E8FF;color:#7C3AED;}
.tag-auto{font-size:10px;background:var(--surface-tint);color:var(--text-tertiary);padding:2px 7px;border-radius:6px;font-weight:800;}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--text);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:100;max-width:82%;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.error{background:var(--danger);}

/* ===================== 로딩 ===================== */
.loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-secondary);padding:24px;text-align:center;}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--vine);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===================== 이름 선택 화면 ===================== */
.identity-screen{padding:28px 20px;min-height:100vh;display:flex;flex-direction:column;}
.identity-header{text-align:center;margin-bottom:18px;}
.brand-mark{width:56px;height:56px;margin:0 auto 10px;}
.identity-header h1{font-size:21px;font-weight:800;letter-spacing:-.02em;}
.identity-header .sub{color:var(--text-secondary);font-size:14px;margin-top:5px;}
.identity-list{flex:1;overflow-y:auto;margin:6px 0 14px;}
.identity-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border-bottom:1px solid var(--border);text-align:left;}
.identity-info{display:flex;flex-direction:column;min-width:0;}
.identity-name{font-size:15px;font-weight:700;}
.identity-dept{font-size:12px;color:var(--text-tertiary);}
.identity-footer{text-align:center;margin-top:18px;}

/* ===================== PIN 화면 ===================== */
.pin-screen{padding:24px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.back-btn{align-self:flex-start;color:var(--text-secondary);font-size:14px;font-weight:700;padding:8px 0;}
.pin-header{text-align:center;margin-top:16px;}
.pin-header .icon{width:30px;height:30px;color:var(--tomato);margin:0 auto 10px;}
.pin-header h2{font-size:19px;font-weight:800;}
.pin-header .sub{color:var(--text-secondary);font-size:13.5px;margin-top:6px;}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:26px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);transition:background .12s,border-color .12s;}
.pin-dot.filled{background:var(--text);border-color:var(--text);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:280px;margin-top:10px;}
.key-btn{aspect-ratio:1;border-radius:50%;background:var(--surface-tint);font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;}
.key-btn .icon{width:20px;height:20px;}
.key-btn:active{background:var(--border);}
.key-btn.empty{background:transparent;pointer-events:none;}

/* ===================== 날짜 카드 / 주간 스트립 ===================== */
.date-card{background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.date-nav{display:flex;align-items:center;justify-content:space-between;}
.date-label{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;
  border:1.5px solid transparent;}
.day-pill.selected{background:var(--surface-tint);border-color:var(--border);}
.day-pill.is-today .day-pill-num{color:var(--tomato);}
.day-pill-dow{font-size:10.5px;color:var(--text-tertiary);font-weight:600;}
.day-pill-num{font-size:14.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.dot{width:6px;height:6px;border-radius:50%;margin-top:1px;}
.dot-eat{background:var(--vine);}
.dot-skip{background:#ADB5BD;}
.dot-unchecked{background:var(--surface);border:1.5px solid var(--border);}

/* ===================== 마감 배너 ===================== */
.deadline-banner{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--warning-bg);
  color:var(--warning-text);padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:700;
  margin-bottom:14px;text-align:center;font-variant-numeric:tabular-nums;}
.deadline-banner .icon{width:16px;height:16px;flex-shrink:0;}

/* ===================== 오늘 체크 상태 버튼 ===================== */
.status-buttons{display:flex;gap:12px;margin-bottom:2px;}
.status-btn{flex:1;min-height:88px;border-radius:18px;border:2px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:15px;
  font-weight:800;color:var(--text-secondary);transition:.15s ease;}
.status-btn .icon{width:26px;height:26px;}
.status-btn.eat.selected{border-color:var(--vine);background:var(--vine);color:#fff;}
.status-btn.skip.selected{border-color:var(--slate);background:var(--slate);color:#fff;}
.status-btn:active{transform:scale(.98);}
.custom-reason{display:flex;gap:8px;margin-top:10px;}
.custom-reason input{margin-bottom:0;flex:1;}
.custom-reason .btn{width:auto;flex-shrink:0;}

/* ===================== 빠른 링크 카드 ===================== */
.quick-links{display:flex;flex-direction:column;gap:10px;}
.quick-link-card{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;
  padding:16px;box-shadow:var(--shadow-sm);font-size:14px;font-weight:700;color:var(--text);width:100%;text-align:left;}
.quick-link-card .icon{width:19px;height:19px;color:var(--vine-dark);}
.quick-link-card .chev{margin-left:auto;color:var(--text-tertiary);font-size:16px;}

/* ===================== 정기 설정 ===================== */
.preset-row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.day-toggle-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px;}
.day-toggle{aspect-ratio:.82;border-radius:13px;border:2px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:13px;}
.day-toggle.selected{background:var(--vine);border-color:var(--vine);color:#fff;}
.day-toggle-status{font-size:10px;font-weight:600;}

/* ===================== 스테퍼 ===================== */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 16px;}
.stepper-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;}
.stepper-btn .icon{width:16px;height:16px;}
.stepper-btn:active{background:var(--surface-tint);}
.stepper-value{font-size:22px;font-weight:800;min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}

/* ===================== 게스트/직원/명단 행 ===================== */
.guest-row,.emp-row,.roster-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.guest-row:last-child,.emp-row:last-child,.roster-row:last-child{border-bottom:none;}
.guest-row-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap;}
.guest-count{font-weight:800;font-size:14px;}
.guest-note{font-size:13px;color:var(--text-secondary);}
.guest-row-meta{font-size:11px;color:var(--text-tertiary);width:100%;margin-top:2px;}
.total-row{text-align:right;font-size:13.5px;color:var(--text-secondary);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.summary-line{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.6;}
.summary-total{font-size:13px;color:var(--text-secondary);margin-top:6px;}
.summary-total b{color:var(--vine-dark);font-size:15px;}
.bulk-actions{margin-top:12px;display:flex;gap:8px;}
.bulk-actions .btn{flex:1;}

.emp-row-info,.roster-row-info{flex:1;min-width:0;}
.emp-row-name{font-size:14px;font-weight:700;}
.emp-row-dept,.roster-row-dept{font-size:12px;color:var(--text-tertiary);font-weight:500;}
.emp-row-status{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
.emp-row-reason{font-size:12px;color:var(--text-secondary);}
.roster-row-name{font-size:14px;font-weight:700;}
.active-badge{font-size:10.5px;padding:3px 8px;border-radius:8px;background:var(--vine-tint);color:var(--vine-dark);font-weight:800;flex-shrink:0;}
.active-badge.inactive{background:var(--surface-tint);color:var(--text-tertiary);}

/* ===================== 프로필 / 더보기 ===================== */
.profile-card{text-align:center;}
.profile-name{font-size:17px;font-weight:800;}
.profile-dept{font-size:13px;color:var(--text-tertiary);margin-top:2px;margin-bottom:4px;}
.footer-note{text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:20px;}

/* ===================== 관리자 편집 카드 ===================== */
.editor-card{border:1.5px solid var(--vine);}
.editor-header{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:12px;gap:8px;}

/* ===================== 통계 ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow-sm);}
.stat-card.highlight{background:var(--vine);color:#fff;}
.stat-card.warn .stat-num{color:var(--warning-text);}
.stat-num{font-size:25px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat-label{font-size:11.5px;margin-top:2px;opacity:.85;font-weight:600;}

/* ===================== 파일 업로드 라벨 ===================== */
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;
  border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:15px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen"><div class="spinner"></div><p>불러오는 중...</p></div>
</div>
<div id="toast" class="toast"></div>

const DOW_LABELS = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토',sun:'일'};
const DOW_ORDER = ['mon','tue','wed','thu','fri','sat','sun'];
const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat']; // Date.getDay() 인덱스용

/* ----------------------- 유틸 ----------------------- */
function esc(str){
  if(str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function genId(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function formatDateLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr(){ return formatDateLocal(new Date()); }
function addDays(dateStr,n){
  const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return formatDateLocal(d);
}
function getDowKey(dateStr){
  const d=new Date(dateStr+'T00:00:00'); return DOW_KEYS[d.getDay()];
}
function currentMonthStr(){
  const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function daysInMonthArr(monthStr){
  const [y,m]=monthStr.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const arr=[];
  for(let day=1; day<=last; day++){ arr.push(monthStr+'-'+String(day).padStart(2,'0')); }
  return arr;
}
function getWeekDates(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();
  const mondayOffset = dow===0 ? -6 : 1-dow;
  const monday=new Date(d); monday.setDate(d.getDate()+mondayOffset);
  const result=[];
  for(let i=0;i<7;i++){ const dd=new Date(monday); dd.setDate(monday.getDate()+i); result.push(formatDateLocal(dd)); }
  return result;
}

/* ----------------------- 저장소 래퍼 (Supabase + 로컬 개인정보) ----------------------- */
const Store = {
  async get(key, shared=true){
    if(!shared){
      try{
        const raw = localStorage.getItem('lunch_'+key);
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }
    try{
      const { data, error } = await withTimeout(sbClient.from('lunch_app_data').select('value').eq('key', key).maybeSingle());
      if(error){ console.error('supabase get error', key, error); return null; }
      return data ? data.value : null;
    }catch(e){ console.error('supabase get error', key, e); return null; }
  },
  async set(key, value, shared=true){
    if(!shared){
      try{ localStorage.setItem('lunch_'+key, JSON.stringify(value)); return true; }catch(e){ return false; }
    }
    try{
      const { error } = await withTimeout(sbClient.from('lunch_app_data').upsert({ key, value, updated_at: new Date().toISOString() }));
      if(error){ console.error('supabase set error', key, error); return false; }
      return true;
    }catch(e){ console.error('supabase set error', key, e); return false; }
  },
  async delete(key, shared=true){
    if(!shared){
      try{ localStorage.removeItem('lunch_'+key); return true; }catch(e){ return false; }
    }
    try{
      const { error } = await withTimeout(sbClient.from('lunch_app_data').delete().eq('key', key));
      return !error;
    }catch(e){ return false; }
  },
  async list(prefix, shared=true){
    if(!shared) return [];
    try{
      const { data, error } = await withTimeout(sbClient.from('lunch_app_data').select('key').like('key', prefix+'%'));
      if(error || !data) return [];
      return data.map(r=>r.key);
    }catch(e){ return []; }
  }
};

let state = {

/* ----------------------- 초기화 & 데이터 로드 ----------------------- */
async function init(){
  if(__sbSetupError){
    document.getElementById('app').innerHTML = '<div class="loading-screen"><p>'+__sbSetupError+'</p></div>';
    return;
  }
  if(!SUPABASE_URL || SUPABASE_URL.includes('YOUR-PROJECT-REF') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
    document.getElementById('app').innerHTML = '<div class="loading-screen"><p>Supabase 설정이 필요해요.<br>코드 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를<br>본인 프로젝트 값으로 바꿔주세요.</p></div>';
    return;
  }
  try{
    const [employees, settings, myProfile, recurring] = await Promise.all([
      Store.get('employees'),
      Store.get('settings'),
      Store.get('myProfile', false),
      Store.get('recurringPatterns'),
    ]);
    state.employees = employees || [];
    state.settings = settings || state.settings;
    if(!settings) await Store.set('settings', state.settings);
    state.recurringPatterns = recurring || {};
    state.myProfile = myProfile;

    if(myProfile && state.employees.some(e=>e.id===myProfile.employeeId && e.active!==false)){
      state.view='employee';
    }else{
      state.view='identity';
    }
    await loadDateData(state.selectedDate);
    render();
  }catch(e){
    console.error('init error', e);
    document.getElementById('app').innerHTML = '<div class="loading-screen"><p>초기 데이터를 불러오지 못했어요.<br>Supabase 프로젝트 URL/키가 정확한지,<br>lunch_app_data 테이블이 생성되어 있는지 확인해주세요.<br><br><small>('+((e&&e.message)?e.message:String(e))+')</small></p></div>';
  }
}
async function loadDateData(date){
  if(!(date in state.checkinsCache)){
    const c = await Store.get('checkins:'+date);
    state.checkinsCache[date] = c || {};
  }
  if(!(date in state.guestsCache)){
    const g = await Store.get('guests:'+date);
    state.guestsCache[date] = g || [];
  }
}
function resolveStatus(empId, dateStr){
  const dayData = state.checkinsCache[dateStr] || {};
  if(dayData[empId]){
    const d = dayData[empId];
    return { status: d.status, reason: d.reason||'', source:'manual', updatedAt: d.updatedAt,
      checkedByEmpId: d.checkedByEmpId||null, checkedByName: d.checkedByName||null, setBy: d.setBy||null };
  }
  const pattern = state.recurringPatterns[empId];
  if(pattern){
    const dow = getDowKey(dateStr);
    const eats = !!pattern[dow];
    return { status: eats?'eat':'skip', reason:'', source:'recurring' };
  }
  return { status:'unchecked', reason:'', source:'none' };
}

/* ----------------------- 렌더 디스패처 ----------------------- */
function render(){
  const app = document.getElementById('app');
  let html='';
  if(state.view==='loading') html = renderLoading();
  else if(state.view==='identity') html = renderIdentity();
  else if(state.view==='adminPin') html = renderAdminPin();
  else if(state.view==='employee') html = renderEmployeeShell();
  else if(state.view==='admin') html = renderAdminShell();
  app.innerHTML = html;
  attachDynamicListeners();
}
function attachSearchFilter(inputId, listSelector, rowSelector){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(listSelector+' '+rowSelector).forEach(row=>{
      const name = (row.dataset.name||'').toLowerCase();
      row.style.display = name.includes(q) ? '' : 'none';
    });
  });
}
function attachDynamicListeners(){
  attachSearchFilter('admin-search', '#admin-emp-list', '.emp-row');
  attachSearchFilter('roster-search', '#roster-list', '.roster-row');
}
function toast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError?' error':'');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.className='toast'; }, 2200);
}
function renderLoading(){
  return '<div class="loading-screen"><div class="spinner"></div><p>불러오는 중...</p></div>';
}

/* ----- 오늘 탭 ----- */
function getDeadlineText(){
  const now = new Date();
  const parts = (state.settings.cutoffTime||'10:00').split(':');
  const ch = parseInt(parts[0],10)||10, cm = parseInt(parts[1],10)||0;
  const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate(), ch, cm, 0, 0);
  const diffMs = cutoff - now;
  if(diffMs<=0) return '마감 시간이 지났어요 (그래도 체크할 수 있어요)';
  const diffMin = Math.ceil(diffMs/60000);
  const h = Math.floor(diffMin/60), m = diffMin%60;
  if(h>0) return `마감까지 ${h}시간 ${m}분 남았어요`;
  return `마감까지 ${m}분 남았어요`;
}
function renderCustomReasonArea(date, r){
  const isEtc = r.reason==='기타' || r.reason.startsWith('기타:');
  if(!isEtc) return '';
  const currentDetail = r.reason.startsWith('기타:') ? r.reason.slice(3).trim() : '';
  return `
    <div class="custom-reason">
      <input id="custom-reason-input" type="text" placeholder="상세 사유 (선택)" value="${esc(currentDetail)}" />
      <button class="btn btn-outline small" onclick="saveCustomReason('${date}')">저장</button>
    </div>`;
}
function renderToday(){
  const date = state.selectedDate;
  const isToday = date === todayStr();
  const empId = state.myProfile.employeeId;
  const r = resolveStatus(empId, date);
  const hasPattern = !!state.recurringPatterns[empId];
  const week = getWeekDates(date);

  const pills = week.map(d=>{
    const rr = resolveStatus(empId, d);
    const dotClass = rr.status==='eat'?'dot-eat':(rr.status==='skip'?'dot-skip':'dot-unchecked');
    const dObj = new Date(d+'T00:00:00');
    const label = DOW_LABELS[DOW_KEYS[dObj.getDay()]];
    const sel = d===date ? 'selected' : '';
    const todayCls = d===todayStr() ? 'is-today' : '';
    return `<button class="day-pill ${sel} ${todayCls}" onclick="selectDate('${d}')">
      <span class="day-pill-dow">${label}</span>
      <span class="day-pill-num">${dObj.getDate()}</span>
      <span class="dot ${dotClass}"></span>
    </button>`;
  }).join('');

  const dObj = new Date(date+'T00:00:00');
  const dowFull = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][dObj.getDay()];
  const dateLabel = `${dObj.getMonth()+1}월 ${dObj.getDate()}일 ${dowFull}` + (isToday?' · 오늘':'');

  const deadlineHtml = isToday ? `<div class="deadline-banner">${icon('clock')}<span id="deadline-banner-text">${getDeadlineText()}</span></div>` : '';

  const reasonChips = REASONS.map(rs=>{
    const sel = r.status==='skip' && (r.reason===rs || (rs==='기타' && r.reason.startsWith('기타')));
    return `<button class="chip ${sel?'selected':''}" onclick="setMyStatus('${date}','skip','${rs}')">${rs}</button>`;
  }).join('');

  const showReasonUI = r.status==='skip' && r.source==='manual';

  const sourceNote = r.source==='recurring'
    ? `<div class="source-note">정기 설정에 따라 자동으로 <b>${r.status==='eat'?'식사함':'식사안함'}</b>으로 되어 있어요. 오늘만 다르면 위에서 선택하세요.</div>`
    : (r.source==='manual' && hasPattern ? `<button class="link-btn small" onclick="revertToPattern('${date}')">정기 설정으로 되돌리기</button>` : '');

  return `
    <div class="date-card">
      <div class="date-nav">
        <button class="icon-btn" onclick="shiftWeek(-1)">‹</button>
        <span class="date-label">${dateLabel}</span>
        <button class="icon-btn" onclick="shiftWeek(1)">›</button>
      </div>
      <div class="week-strip">${pills}</div>
    </div>
    ${deadlineHtml}
    <div class="card">
      <div class="status-buttons">
        <button class="status-btn eat ${r.status==='eat'?'selected':''}" onclick="setMyStatus('${date}','eat')">${icon('check')}<span>먹어요</span></button>
        <button class="status-btn skip ${r.status==='skip'?'selected':''}" onclick="setMyStatus('${date}','skip','')">${icon('x')}<span>안 먹어요</span></button>
      </div>
      ${r.status==='unchecked' ? '<p class="hint-text">오늘 점심 식사 여부를 선택해주세요</p>' : ''}
      ${showReasonUI ? `<div class="chip-grid">${reasonChips}</div>` : ''}
      ${showReasonUI ? renderCustomReasonArea(date, r) : ''}
      ${sourceNote}
    </div>
    <div class="quick-links">
      <button class="quick-link-card" onclick="switchEmployeeTab('recurring')">${icon('gear')}<span>정기 식사 패턴 설정하기</span><span class="chev">›</span></button>
      <button class="quick-link-card" onclick="switchEmployeeTab('guests')">${icon('users')}<span>외부/일용직 인원 추가하기</span><span class="chev">›</span></button>
    </div>
    <div class="card">
      <h2 class="section-title">${icon('users')} 동료 대신 체크하기</h2>
      <p class="desc-text">자리를 비운 동료를 대신 체크할 수 있어요. 누가 체크했는지는 관리자가 확인할 수 있어요.</p>
      <input id="proxy-search" type="text" placeholder="동료 이름 검색" oninput="filterProxyResults(this.value)" />
      <div id="proxy-results"></div>
      ${state.proxyEditingEmpId ? renderProxyEditor(date) : ''}
    </div>
  `;
}

async function saveCustomReason(date){
  const val = document.getElementById('custom-reason-input').value.trim();
  const reason = val ? `기타: ${val}` : '기타';
  await setMyStatus(date, 'skip', reason);
}
async function setMyStatus(dateStr, status, reason){
  if(reason===undefined) reason='';
  if(!state.myProfile) return;
  const prevDay = {...(state.checkinsCache[dateStr]||{})};
  const day = {...(state.checkinsCache[dateStr]||{})};
  day[state.myProfile.employeeId] = {status, reason, updatedAt: Date.now(), checkedByEmpId: state.myProfile.employeeId, checkedByName: state.myProfile.name};
  state.checkinsCache[dateStr] = day;
  render();
  const ok = await Store.set('checkins:'+dateStr, day);
  if(!ok){
    state.checkinsCache[dateStr] = prevDay;
    render();
    toast('저장에 실패했어요. 다시 시도해주세요.', true);
  }else{
    toast('저장되었습니다');
  }
}
async function proxyCheckStatus(dateStr, targetEmpId, status, reason){
  if(reason===undefined) reason='';
  if(!state.myProfile) return;
  const day = {...(state.checkinsCache[dateStr]||{})};
  day[targetEmpId] = {status, reason, updatedAt: Date.now(), checkedByEmpId: state.myProfile.employeeId, checkedByName: state.myProfile.name};
  state.checkinsCache[dateStr] = day;
  render();
  const ok = await Store.set('checkins:'+dateStr, day);
  toast(ok?'저장되었습니다':'저장에 실패했어요', !ok);
}
async function revertToPattern(dateStr){
  const day = {...(state.checkinsCache[dateStr]||{})};
  delete day[state.myProfile.employeeId];
  state.checkinsCache[dateStr] = day;
  render();
  await Store.set('checkins:'+dateStr, day);
}
async function selectDate(dateStr){
  state.selectedDate = dateStr;
  state.proxyEditingEmpId = null;
  await loadDateData(dateStr);
  render();
}
async function shiftWeek(n){
  state.selectedDate = addDays(state.selectedDate, 7*n);
  state.proxyEditingEmpId = null;
  await loadDateData(state.selectedDate);
  render();
}

/* ----- 정기설정 탭 ----- */
function renderRecurring(){
  const empId = state.myProfile.employeeId;
  const pattern = state.recurringPatterns[empId] || {mon:false,tue:false,wed:false,thu:false,fri:false,sat:false,sun:false};
  const dayToggles = DOW_ORDER.map(k=>`
    <button class="day-toggle ${pattern[k]?'selected':''}" onclick="toggleRecurringDay('${k}')">
      <span>${DOW_LABELS[k]}</span>
      <span class="day-toggle-status">${pattern[k]?'식사':'—'}</span>
    </button>`).join('');
  return `
    <div class="card">
      <h2 class="section-title">${icon('gear')} 정기 식사 패턴</h2>
      <p class="desc-text">요일별로 기본 식사 여부를 설정해두면 매주 자동으로 적용돼요. 특정 날짜만 다르면 '오늘' 탭에서 그 날짜를 선택해 개별로 바꾸면 됩니다.</p>
      <div class="preset-row">
        <button class="btn btn-outline small" onclick="applyPreset('weekday')">평일만 먹기</button>
        <button class="btn btn-outline small" onclick="applyPreset('all')">매일 먹기</button>
        <button class="btn btn-outline small" onclick="applyPreset('none')">전체 해제</button>
      </div>
      <div class="day-toggle-grid">${dayToggles}</div>
    </div>
  `;
}
function toggleRecurringDay(dayKey){
  const empId = state.myProfile.employeeId;
  const pattern = {mon:false,tue:false,wed:false,thu:false,fri:false,sat:false,sun:false, ...(state.recurringPatterns[empId]||{})};
  pattern[dayKey] = !pattern[dayKey];
  updateMyPattern(pattern);
}
function applyPreset(kind){
  let pattern;
  if(kind==='weekday') pattern = {mon:true,tue:true,wed:true,thu:true,fri:true,sat:false,sun:false};
  else if(kind==='all') pattern = {mon:true,tue:true,wed:true,thu:true,fri:true,sat:true,sun:true};
  else pattern = {mon:false,tue:false,wed:false,thu:false,fri:false,sat:false,sun:false};
  updateMyPattern(pattern);
}
async function updateMyPattern(pattern){
  state.recurringPatterns[state.myProfile.employeeId] = pattern;
  render();
  const ok = await Store.set('recurringPatterns', state.recurringPatterns);
  toast(ok?'정기 설정이 저장되었어요':'저장에 실패했어요', !ok);
}

/* ----- 외부/일용직 공용 렌더 ----- */
function renderMyRequestSummary(date){
  const empId = state.myProfile.employeeId;
  const emp = state.employees.find(e=>e.id===empId);
  const r = resolveStatus(empId, date);
  const myGuests = (state.guestsCache[date]||[]).filter(g=>g.addedByEmpId===empId);
  const extCount = myGuests.filter(g=>g.type==='외부인').reduce((s,g)=>s+g.count,0);
  const dayCount = myGuests.filter(g=>g.type==='일용직').reduce((s,g)=>s+g.count,0);
  const myMeal = r.status==='eat' ? 1 : 0;
  const total = myMeal + extCount + dayCount;
  const parts = [];
  if(myMeal) parts.push(`${esc(emp?emp.name:'나')} ${myMeal}명`);
  if(extCount) parts.push(`외부인 ${extCount}명`);
  if(dayCount) parts.push(`일용직 ${dayCount}명`);
  return `
    <div class="card">
      <h2 class="section-title">${icon('users')} 내가 신청한 인원</h2>
      ${total ? `
        <div class="summary-line">${parts.join(' / ')}</div>
        <div class="summary-total">총 <b>${total}명</b> 신청</div>
      ` : '<p class="empty-hint" style="padding:14px 8px;">아직 신청한 인원이 없어요</p>'}
    </div>`;
}

/* ----- 대시보드 ----- */
function computeDailySummary(dateStr){
  let eatCount=0, skipList=[], uncheckedList=[];
  for(const emp of state.employees.filter(e=>e.active!==false)){
    const r = resolveStatus(emp.id, dateStr);
    if(r.status==='eat') eatCount++;
    else if(r.status==='skip') skipList.push({...emp, reason:r.reason});
    else uncheckedList.push(emp);
  }
  const guests = state.guestsCache[dateStr] || [];
  let guestBreakdown = {}, guestTotal = 0;
  for(const g of guests){ guestBreakdown[g.type]=(guestBreakdown[g.type]||0)+g.count; guestTotal+=g.count; }
  return {eatCount, skipList, uncheckedList, guestTotal, guestBreakdown};
}
function generateVendorText(dateStr){
  const s = computeDailySummary(dateStr);
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['일','월','화','수','목','금','토'][d.getDay()];
  const dateLabel = `${d.getMonth()+1}월 ${d.getDate()}일(${dow})`;
  const total = s.eatCount + s.guestTotal;
  let lines = [];
  if(state.settings.vendorName) lines.push(`${state.settings.vendorName} 사장님, 안녕하세요.`);
  const header = `[${state.settings.companyName||''} 점심 인원]`;
  lines.push(header);
  lines.push(dateLabel);
  lines.push(`총 ${total}명`);
  if(s.uncheckedList.length) lines.push(`\n※ 미체크 ${s.uncheckedList.length}명은 별도 확인이 필요해요`);
  return lines.join('\n');
}
async function loadSettlementMonth(monthStr){
  state.settlementLoading = true;
  state.settlementMonth = monthStr;
  render();
  const todayD = todayStr();
  const dates = daysInMonthArr(monthStr).filter(d => d <= todayD);
  await Promise.all(dates.map(d => loadDateData(d)));
  state.settlementRows = dates.map(d => {
    const s = computeDailySummary(d);
    const guestExt = s.guestBreakdown['외부인'] || 0;
    const guestDay = s.guestBreakdown['일용직'] || 0;
    return { date: d, eat: s.eatCount, guestExt, guestDay, guestTotal: s.guestTotal, total: s.eatCount + s.guestTotal, unchecked: s.uncheckedList.length };
  });
  state.settlementLoading = false;
  render();
}
function changeSettlementMonth(val){
  if(!val) return;

  loadSettlementMonth(val);
}

          </table>
        </div>
        ${!unitPrice ? '<p class="muted-text">설정 탭에서 식대 단가를 입력하면 예상 금액도 함께 보여드려요.</p>' : ''}
        <button class="btn btn-primary full" onclick="downloadSettlementCSV()" style="margin-top:14px;">${icon('download')} 월별 데이터 다운로드 (CSV)</button>
      ` : '<div class="empty-hint">해당 월에 데이터가 아직 없어요</div>')}

function downloadSettlementCSV(){
  const rows = state.settlementRows || [];
  if(!rows.length){ toast('다운로드할 데이터가 없어요', true); return; }
  const unitPrice = parseInt(state.settings.mealUnitPrice, 10) || 0;
  const dowArr = ['일','월','화','수','목','금','토'];
  const header = ['날짜','요일','직원 식사','외부인','일용직','합계'];
  if(unitPrice) header.push('금액(원)');
  const lines = [header.join(',')];
  let sumEat=0, sumExt=0, sumDay=0, sumTotal=0;
  for(const r of rows){
    const d = new Date(r.date+'T00:00:00');
    sumEat+=r.eat; sumExt+=r.guestExt; sumDay+=r.guestDay; sumTotal+=r.total;
    const cols = [r.date, dowArr[d.getDay()], r.eat, r.guestExt, r.guestDay, r.total];
    if(unitPrice) cols.push(r.total*unitPrice);
    lines.push(cols.join(','));
  }
  const totalCols = ['합계','', sumEat, sumExt, sumDay, sumTotal];
  if(unitPrice) totalCols.push(sumTotal*unitPrice);
  lines.push(totalCols.join(','));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(state.settings.companyName||'점심')}_점심정산_${state.settlementMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('다운로드 되었어요');
}

        <button class="btn btn-outline" onclick="toggleEmployeeActive('${emp.id}')">${emp.active===false?'재직으로 전환':'퇴사 처리'}</button>
      </div>
      <button class="btn btn-primary full" onclick="submitEditEmployee()">저장</button>
    </div>`;
}
function renderAdminRoster(){
  const list = [...state.employees].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const rows = list.map(e=>`
    <div class="roster-row" data-name="${esc(e.name.toLowerCase())}">
      <span class="avatar-circle sm">${esc(e.name.slice(0,1))}</span>
      <div class="roster-row-info">
        <div class="roster-row-name">${esc(e.name)}</div>
        <div class="roster-row-dept">${esc(e.dept||'부서 미지정')}</div>
      </div>
      <span class="active-badge ${e.active===false?'inactive':''}">${e.active===false?'퇴사':'재직'}</span>
      <button class="icon-btn" onclick="openEditEmployee('${e.id}')">${icon('pencil')}</button>
      <button class="icon-btn danger" onclick="deleteEmployeeConfirm('${e.id}')">${icon('trash')}</button>
    </div>`).join('');

  const addHtml = state.showAddEmployee ? `
    <div class="card">
      <label>이름</label><input id="new-emp-name" type="text" placeholder="홍길동" />
      <label>부서 (선택)</label><input id="new-emp-dept" type="text" placeholder="생산팀" />
      <button class="btn btn-primary full" onclick="submitAddEmployee()">추가하기</button>
    </div>` : '';
  const bulkHtml = state.showBulkAdd ? `
    <div class="card">
      <p class="desc-text">한 줄에 한 명씩 "이름,부서" 형식으로 입력해주세요 (부서는 생략 가능해요)</p>
      <textarea id="bulk-add-text" rows="5" placeholder="홍길동,생산팀
김철수"></textarea>
      <button class="btn btn-primary full" onclick="submitBulkAdd()">일괄 추가하기</button>
    </div>` : '';
  const editHtml = state.editingEmpId ? renderEmployeeEditForm() : '';

  return `
    <input id="roster-search" type="text" placeholder="이름 검색" />
    <div class="btn-row">
      <button class="btn btn-outline" onclick="toggleAddEmployee()">${icon('plus')} 직원 추가</button>
      <button class="btn btn-outline" onclick="toggleBulkAdd()">여러 명 추가</button>
    </div>
    ${addHtml}
    ${bulkHtml}
    ${editHtml}
    <div class="card">
      <div class="roster-list" id="roster-list">${rows || '<p class="empty-hint">등록된 직원이 없어요.<br>위에서 추가해보세요.</p>'}</div>
    </div>
  `;
}
function toggleAddEmployee(){ state.showAddEmployee=!state.showAddEmployee; state.showBulkAdd=false; render(); }
function toggleBulkAdd(){ state.showBulkAdd=!state.showBulkAdd; state.showAddEmployee=false; render(); }
async function submitAddEmployee(){
  const name = document.getElementById('new-emp-name').value.trim();
  const dept = document.getElementById('new-emp-dept').value.trim();
  if(!name){ toast('이름을 입력해주세요', true); return; }
  state.employees.push({id:genId(), name, dept, active:true, createdAt:Date.now()});
  state.showAddEmployee=false;
  render();
  await Store.set('employees', state.employees);
  toast('추가되었어요');
}
async function submitBulkAdd(){
  const text = document.getElementById('bulk-add-text').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let count=0;
  for(const line of lines){
    const parts = line.split(',');
    const name = (parts[0]||'').trim();
    const dept = (parts[1]||'').trim();
    if(name){ state.employees.push({id:genId(), name, dept, active:true, createdAt:Date.now()}); count++; }
  }
  state.showBulkAdd=false;
  render();
  await Store.set('employees', state.employees);
  toast(`${count}명 추가되었어요`);
}
function openEditEmployee(id){ state.editingEmpId=id; render(); }
function closeEditEmployee(){ state.editingEmpId=null; render(); }
async function submitEditEmployee(){
  const name = document.getElementById('edit-emp-name').value.trim();
  const dept = document.getElementById('edit-emp-dept').value.trim();
  if(!name){ toast('이름을 입력해주세요', true); return; }
  state.employees = state.employees.map(e=> e.id===state.editingEmpId ? {...e, name, dept} : e);
  state.editingEmpId=null;
  render();
  await Store.set('employees', state.employees);
  toast('저장되었어요');
}
async function toggleEmployeeActive(id){
  state.employees = state.employees.map(e=> e.id===id ? {...e, active: e.active===false?true:false} : e);
  render();
  await Store.set('employees', state.employees);
}
function deleteEmployeeConfirm(id){
  const emp = state.employees.find(e=>e.id===id);
  if(!emp) return;
  if(!confirm(`${emp.name}님을 삭제할까요? 이 작업은 되돌릴 수 없어요.`)) return;
  deleteEmployee(id);
}
async function deleteEmployee(id){
  state.employees = state.employees.filter(e=>e.id!==id);
  render();
  await Store.set('employees', state.employees);
  toast('삭제되었어요');
}

/* ----- 설정 ----- */
function renderAdminSettings(){
  const s = state.settings;
  return `
    <div class="card">
      <h2 class="section-title">${icon('gear')} 기본 설정</h2>
      <label>마감 시간</label>
      <input id="setting-cutoff" type="time" value="${s.cutoffTime}" />
      <label>회사명</label>
      <input id="setting-company" type="text" value="${esc(s.companyName||'')}" />
      <label>업체명 (선택)</label>
      <input id="setting-vendor" type="text" value="${esc(s.vendorName||'')}" placeholder="공유 텍스트에 표시할 업체명" />
      <label>1인당 식대 단가 (원, 선택)</label>
      <input id="setting-unit-price" type="number" inputmode="numeric" value="${esc(s.mealUnitPrice||'')}" placeholder="예: 7000" />
      <button class="btn btn-primary full" onclick="saveGeneralSettings()">저장</button>
    </div>
    <div class="card">
      <h2 class="section-title">${icon('lock')} 관리자 PIN 변경</h2>
      <label>새 PIN (4자리 숫자)</label>
      <input id="setting-pin" type="text" inputmode="numeric" maxlength="4" placeholder="0000" />
      <button class="btn btn-outline full" onclick="savePinSetting()">PIN 변경</button>
    </div>
    <div class="card">
      <h2 class="section-title">데이터 백업 / 복원</h2>
      <button class="btn btn-outline full" onclick="exportBackup()">${icon('download')} 백업 파일 다운로드</button>
      <label class="file-label">${icon('upload')} 백업 파일에서 복원
        <input id="restore-file-input" type="file" accept="application/json" onchange="handleRestoreFile(this)" hidden />
      </label>
    </div>
    <button class="btn btn-outline full danger-text" onclick="exitAdmin()">관리자 모드 종료</button>
  `;
}
async function saveGeneralSettings(){
  const cutoffTime = document.getElementById('setting-cutoff').value || state.settings.cutoffTime;
  const companyName = document.getElementById('setting-company').value.trim();
  const vendorName = document.getElementById('setting-vendor').value.trim();
  const mealUnitPrice = document.getElementById('setting-unit-price').value.trim();
  state.settings = {...state.settings, cutoffTime, companyName, vendorName, mealUnitPrice};
  render();
  await Store.set('settings', state.settings);
  toast('설정이 저장되었어요');
}
async function savePinSetting(){
  const pin = document.getElementById('setting-pin').value.trim();
  if(!/^\d{4}$/.test(pin)){ toast('4자리 숫자로 입력해주세요', true); return; }
  state.settings = {...state.settings, adminPin:pin};
  render();
  await Store.set('settings', state.settings);
  toast('PIN이 변경되었어요');
}
async function exportBackup(){
  const checkinKeys = await Store.list('checkins:');
  const guestKeys = await Store.list('guests:');
  const checkinsData = {};
  for(const k of checkinKeys){ checkinsData[k] = await Store.get(k); }
  const guestsData = {};
  for(const k of guestKeys){ guestsData[k] = await Store.get(k); }
  const backup = {
    employees: state.employees, settings: state.settings, recurringPatterns: state.recurringPatterns,
    checkins: checkinsData, guests: guestsData, exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `lunch-checkin-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('백업 파일을 다운로드했어요');
}
function handleRestoreFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!confirm('백업 파일로 복원하면 현재 데이터가 덮어쓰기 될 수 있어요. 계속할까요?')){ input.value=''; return; }
  importBackupFile(file);
  input.value='';
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(data.employees){ state.employees = data.employees; await Store.set('employees', state.employees); }
      if(data.settings){ state.settings = data.settings; await Store.set('settings', state.settings); }
      if(data.recurringPatterns){ state.recurringPatterns = data.recurringPatterns; await Store.set('recurringPatterns', state.recurringPatterns); }
      if(data.checkins){ for(const [k,v] of Object.entries(data.checkins)){ await Store.set(k, v); } }
      if(data.guests){ for(const [k,v] of Object.entries(data.guests)){ await Store.set(k, v); } }
      state.checkinsCache = {}; state.guestsCache = {};
      await loadDateData(state.adminDate);
      toast('복원되었어요');
      render();
    }catch(err){
      toast('복원 중 오류가 발생했어요', true);
    }
  };
  reader.readAsText(file);
}

/* ----------------------- 부팅 ----------------------- */
init();
setInterval(() => {
  const el = document.getElementById('deadline-banner-text');
  if(el) el.textContent = getDeadlineText();
}, 30000);
</script>
